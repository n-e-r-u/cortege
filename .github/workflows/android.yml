# Appli Android (Play Store) : construit l'appli à partir du dossier android/ (coquille qui ouvre le site en plein écran).
# Lancée à la main (Actions > Appli Android > Run workflow) ou par une étiquette android-v1.0.0.
# Avec les secrets ANDROID_KEYSTORE_B64, ANDROID_KEYSTORE_PASSWORD et ANDROID_KEY_PASSWORD, le paquet est signé avec la clé
# d'envoi : cortege.aab pour le Play Store, cortege.apk à installer directement. Sans eux, une version de test (debug) seulement.
name: Appli Android
on:
  workflow_dispatch:
  push:
    tags: ['android-v*']
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: '17'
      - name: Construire
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon bundleRelease assembleRelease assembleDebug
      - name: Signer avec la clé d'envoi
        working-directory: android
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          mkdir -p ../out
          cp app/build/outputs/apk/debug/app-debug.apk ../out/cortege-test-debug.apk
          if [ -z "$KS" ]; then echo "Pas de clé d'envoi dans les secrets : version de test seulement."; exit 0; fi
          # Espaces et retours à la ligne ajoutés au copier-coller : ignorés
          printf '%s' "$KS" | tr -d ' \r\n\t' | base64 -d > "$RUNNER_TEMP/upload.keystore" || { echo "::error::ANDROID_KEYSTORE_B64 n'est pas du base64 valide : recolle-le en entier."; exit 1; }
          echo "Clé décodée : $(stat -c %s "$RUNNER_TEMP/upload.keystore") octets"
          if ! keytool -list -keystore "$RUNNER_TEMP/upload.keystore" -storepass "$KS_PASS" -alias cortege > /dev/null 2>"$RUNNER_TEMP/kt.err"; then
            if grep -qi "password\|tag\|mac" "$RUNNER_TEMP/kt.err"; then echo "::error::Mot de passe refusé : vérifie ANDROID_KEYSTORE_PASSWORD."
            elif grep -qi "alias" "$RUNNER_TEMP/kt.err"; then echo "::error::La clé n'a pas l'alias « cortege »."
            else echo "::error::Clé illisible : ANDROID_KEYSTORE_B64 est incomplet ou abîmé. Recolle-le en entier."; fi
            cat "$RUNNER_TEMP/kt.err"; rm -f "$RUNNER_TEMP/upload.keystore"; exit 1
          fi
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          cp app/build/outputs/bundle/release/app-release.aab ../out/cortege.aab
          jarsigner -keystore "$RUNNER_TEMP/upload.keystore" -storepass "$KS_PASS" -keypass "${KEY_PASS:-$KS_PASS}" ../out/cortege.aab cortege
          "$BT/zipalign" -p -f 4 app/build/outputs/apk/release/app-release-unsigned.apk "$RUNNER_TEMP/aligned.apk"
          "$BT/apksigner" sign --ks "$RUNNER_TEMP/upload.keystore" --ks-pass env:KS_PASS --key-pass "env:${KEY_PASS:+KEY_PASS}${KEY_PASS:-KS_PASS}" --ks-key-alias cortege --out ../out/cortege.apk "$RUNNER_TEMP/aligned.apk"
          "$BT/apksigner" verify --print-certs ../out/cortege.apk | grep -i "SHA-256"
          rm -f "$RUNNER_TEMP/upload.keystore"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: cortege-android
          path: out/
          retention-days: 14
