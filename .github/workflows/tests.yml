name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
      - name: Vérification de la syntaxe
        run: node --check server.js && node --check public/app.js && node --check public/sw.js && node --check verifier.js
      - name: ESLint (serveur)
        run: npx --yes eslint@9.39.5 -c eslint.config.js --no-config-lookup server.js src tools/*.js verifier.js
      - name: Lecteur de PDF (veille des recueils d'actes)
        run: sudo apt-get install -y --no-install-recommends poppler-utils
      - name: Tests du serveur
        run: node --test test/*.test.js
      - name: Test de fumée dans un navigateur
        run: |
          npm install --no-save --no-package-lock playwright@1.65.0
          npx playwright install --with-deps chromium
          E2E_REQUIRED=1 node test/e2e/smoke.js
