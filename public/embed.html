<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Cortège · carte en direct</title>
<link rel="stylesheet" href="/theme.css">
<script src="/theme.js"></script>
<link rel="stylesheet" href="/vendor/leaflet.css">
<style>
html, body, #map { height: 100%; margin: 0; background: var(--bg); }
body { font: 14px/1.4 var(--font); color: var(--fg); }
:root:not([data-theme="light"]) .raster .leaflet-tile-pane, :root:not([data-theme="light"]) .osm-fallback { filter: invert(1) hue-rotate(180deg) brightness(.95) contrast(.9) saturate(.6); }
.pin { width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; font-size: 15px; background: var(--surface); border: 3px solid var(--c); box-shadow: 0 2px 8px rgba(0,0,0,.5); }
.pin.old { opacity: .55; }
.bar { position: absolute; z-index: 1000; left: 8px; right: 8px; bottom: 8px; display: flex; justify-content: space-between; align-items: center; gap: 8px;
  background: var(--overlay); border: 1px solid var(--line); border-radius: 12px; padding: 8px 12px; }
.bar a { color: var(--accent); font-weight: 800; text-decoration: none; white-space: nowrap; }
.bar span { color: var(--muted); font-size: 12.5px; }
.live { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--soutien); margin-right: 6px; }
.leaflet-popup-content-wrapper, .leaflet-popup-tip { background: var(--surface); color: var(--fg); }
.leaflet-container a.leaflet-popup-close-button { color: var(--muted); }
</style>
</head>
<body>
<div id="map"></div>
<div class="bar"><span><i class="live"></i><span id="state">Carte en direct des manifs</span></span><a id="open" href="/" target="_blank" rel="noopener">Ouvrir Cortège ↗</a></div>
<script src="/vendor/leaflet.js"></script>
<script src="/map-style.js"></script>
<script src="/embed.js"></script>
</body>
</html>
