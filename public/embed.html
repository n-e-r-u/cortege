<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Cortège · carte en direct</title>
<link rel="stylesheet" href="/vendor/leaflet.css">
<style>
@font-face { font-family: Inter; font-weight: 400; src: url(/vendor/fonts/inter-400.woff2) format('woff2'); }
@font-face { font-family: Inter; font-weight: 700; src: url(/vendor/fonts/inter-700.woff2) format('woff2'); }
html, body, #map { height: 100%; margin: 0; background: #121214; }
body { font: 14px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif; color: #f2f1f4; }
.raster .leaflet-tile-pane, .osm-fallback { filter: invert(1) hue-rotate(180deg) brightness(.95) contrast(.9) saturate(.6); }
.pin { width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; font-size: 15px; background: #1c1c20; border: 3px solid var(--c); box-shadow: 0 2px 8px rgba(0,0,0,.5); }
.pin.old { opacity: .55; }
.bar { position: absolute; z-index: 1000; left: 8px; right: 8px; bottom: 8px; display: flex; justify-content: space-between; align-items: center; gap: 8px;
  background: rgba(28,28,32,.92); border: 1px solid #34343c; border-radius: 12px; padding: 8px 12px; }
.bar a { color: #ec9fa4; font-weight: 800; text-decoration: none; white-space: nowrap; }
.bar span { color: #a3a1ad; font-size: 12.5px; }
.live { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: #30a46c; margin-right: 6px; }
.leaflet-popup-content-wrapper, .leaflet-popup-tip { background: #1c1c20; color: #f2f1f4; }
.leaflet-container a.leaflet-popup-close-button { color: #a3a1ad; }
</style>
</head>
<body>
<div id="map"></div>
<div class="bar"><span><i class="live"></i><span id="state">Carte en direct des manifs</span></span><a id="open" href="/" target="_blank" rel="noopener">Ouvrir Cortège ↗</a></div>
<script src="/vendor/leaflet.js"></script>
<script src="/map-style.js"></script>
<script src="/embed.js"></script>
</body>
</html>
