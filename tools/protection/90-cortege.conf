# Réglages réseau du noyau pour encaisser les rafales (copié dans /etc/sysctl.d/)
# Protège contre les inondations de demandes de connexion (SYN flood) sans rien refuser aux vraies visites
net.ipv4.tcp_syncookies = 1
net.ipv4.tcp_max_syn_backlog = 8192
net.core.somaxconn = 8192
net.core.netdev_max_backlog = 16384
# Plus de connexions suivies en même temps (sinon le pare-feu sature avant le site)
net.netfilter.nf_conntrack_max = 524288
# Connexions abandonnées libérées plus vite
net.ipv4.tcp_fin_timeout = 15
net.netfilter.nf_conntrack_tcp_timeout_established = 3600
