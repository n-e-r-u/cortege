# Cloisonnement du service Cortège (complément de cortege.service).
# Installation : sudo cp tools/systemd/durcissement.conf /etc/systemd/system/cortege.service.d/
#               sudo systemctl daemon-reload && sudo systemctl restart cortege
# Retrait :      sudo rm /etc/systemd/system/cortege.service.d/durcissement.conf (puis les deux mêmes commandes)
[Service]
# Fichiers : rien en dehors des dossiers de l'appli (ProtectSystem=strict et ReadWritePaths sont dans le service)
PrivateTmp=yes
ProtectHome=yes
PrivateDevices=yes
# Noyau et système : lecture seule ou invisible
ProtectKernelTunables=yes
ProtectKernelModules=yes
ProtectKernelLogs=yes
ProtectControlGroups=yes
ProtectClock=yes
ProtectHostname=yes
ProtectProc=invisible
# Aucun privilège, même en cas de faille dans Node
CapabilityBoundingSet=
AmbientCapabilities=
RestrictSUIDSGID=yes
RestrictNamespaces=yes
RestrictRealtime=yes
LockPersonality=yes
RemoveIPC=yes
# Réseau : seulement Internet (IPv4, IPv6) et les sockets locales
RestrictAddressFamilies=AF_INET AF_INET6 AF_UNIX
# Appels système : ceux d'un service ordinaire, sans les fonctions d'administration
SystemCallArchitectures=native
SystemCallFilter=@system-service
SystemCallFilter=~@privileged
SystemCallErrorNumber=EPERM
# Pas de MemoryDenyWriteExecute : le moteur JavaScript de Node en a besoin.
# Pas de ProcSubset=pid : l'onglet Direct lit le nombre de processeurs dans /proc.
